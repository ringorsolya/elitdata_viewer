<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ElitData ellenőrző felület</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --ink:#1f2328; --muted:#5e6670; --line:#ddd7cb;
  --accent:#7a3b1d; --accent-ink:#fff; --accent-soft:#f3e4d8;
  --kig:#2f5d7c; --kig-soft:#e2edf4; --uj:#4f7a35; --uj-soft:#e7f0df;
  --warn:#9a6a00; --warn-soft:#fbf0d2; --bad:#a1332c; --bad-soft:#f8e1de; --ok:#2f6b3f; --ok-soft:#e1f0e5;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --panel:#1e2125; --ink:#e7e4de; --muted:#a3a9b1; --line:#33373d;
    --accent:#d9895a; --accent-ink:#1a1a1a; --accent-soft:#3a2a20;
    --kig:#8fb9d6; --kig-soft:#21323f; --uj:#a7cf8a; --uj-soft:#26331f;
    --warn:#e7c25a; --warn-soft:#3a3220; --bad:#f08a80; --bad-soft:#3d2522; --ok:#8fd19e; --ok-soft:#203427;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;margin:0}
h1{font-size:1.25rem} h2{font-size:1.35rem;margin-bottom:.4rem} h3{font-size:1.05rem;margin:1.2rem 0 .5rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}
.brand small{color:var(--muted);font-size:.85rem}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.user{color:var(--muted);font-size:.9rem;display:flex;gap:10px;align-items:center}
main{padding:20px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.pager{flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.toolbar select{max-width:100%;min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:60px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-weight:600;margin-left:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;background:var(--bg);position:sticky;top:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
tr.sel td{background:var(--accent-soft)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b-kig{background:var(--kig-soft);color:var(--kig)} .b-uj{background:var(--uj-soft);color:var(--uj)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.b-info{background:var(--accent-soft);color:var(--accent)}
.csop-tag{display:inline-flex;gap:4px;align-items:center;margin-right:10px;font-weight:500}
.chip.muted{opacity:.6}
.csop-racs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.csop-kartya{cursor:pointer}.csop-kartya:hover{border-color:var(--accent)}
.halad{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.halad div{height:100%;background:var(--ok)}
.csop-sav{position:sticky;top:64px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px;padding:10px 14px}
.csop-sav input{min-width:220px}
.ck-tbl td{padding:4px 6px}.ck-tbl tr.uj-szemely td{border-top:2px solid var(--line)}
.ck-in{width:100%;min-width:0;padding:3px 6px;border-color:transparent;background:var(--bg)}
.ck-in:focus{border-color:var(--accent)}.ck-in.valt{background:var(--warn-soft);border-color:var(--warn)}.ck-in.jav{box-shadow:inset 3px 0 0 var(--accent)}
.ck-tbl td.w-fogl{min-width:170px}.ck-tbl td.w-mh{min-width:200px}
.ck-mentes{margin-top:12px}
.sor-kartya{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.sor-kartya.uj{border-style:dashed;border-color:var(--accent)}
.sor-kartya.torolve{opacity:.55}.sor-kartya.torolve .szerk-racs{text-decoration:line-through}
.sor-kartya .sor-kartya{background:var(--panel)}
.sor-fej{margin-bottom:6px}.sor-lab{display:flex;justify-content:flex-end;margin-top:6px}
.sor-lab .torles{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--bad)}
.sor-kartya details{margin-top:6px}.sor-kartya summary{cursor:pointer}
.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:4px 14px}
.kv div:nth-child(odd){color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}
.form{display:grid;gap:10px;margin-top:10px}
.form label{display:grid;gap:4px;font-size:.9rem;color:var(--muted)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:.95rem}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0}
.jv-sor{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line,#e5e0d8)} .jv-sor input{margin-top:4px} .jv-tart{flex:1} .jv-tart blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--line,#e5e0d8);white-space:pre-wrap}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.err{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--kig-soft);color:var(--kig)}
.login{max-width:440px;margin:10vh auto;padding:28px}
.login p{color:var(--muted)}
.hidden{display:none!important}
.empty{color:var(--muted);padding:20px;text-align:center}
.sticky{position:sticky;top:72px}
@media (max-width:900px){.sticky{position:static}}
@media (max-width:700px){
  header.top{position:static}
  header.top .wrap{padding-top:8px;padding-bottom:8px;gap:8px}
  nav.tabs{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto}
  nav.tabs button{white-space:nowrap}
  .user{flex:1;justify-content:flex-end}
  .kv{grid-template-columns:1fr}
  .kv div:nth-child(odd){margin-top:6px}
}
.kod{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--warn);background:var(--warn-soft);border-radius:5px;padding:0 5px;white-space:nowrap}
.szakasz{margin-bottom:14px;position:relative}
.szerk-gomb{position:absolute;top:12px;right:16px}
.szerk-racs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.szerk-racs label{min-width:0}.szerk-racs select,.szerk-racs input{width:100%;min-width:0}
.lap-forras{margin:8px 0;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;font-size:.9rem;display:block}
input.hibas{border-color:#c0392b !important}
.forras-box{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:10px}
.forras-box legend{color:var(--accent);font-weight:600;padding:0 6px}
tr.visszavont td{opacity:.55;text-decoration:line-through}
.btn.small{padding:3px 8px;font-size:.85rem}
.szakasz h3{margin-top:0}
h4{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:.98rem;margin:14px 0 6px}
.fejlec{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ugro{display:flex;flex-wrap:wrap;gap:4px 10px;max-width:640px;font-size:.88rem;justify-content:flex-end}
.ugro a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line)}
.ugro a:hover{color:var(--accent)}
@media (max-width:700px){.ugro{justify-content:flex-start}}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:6px 0 12px}
</style>
</head>
<body>
<header class="top hidden" id="top">
  <div class="wrap">
    <div class="brand"><h1>ElitData</h1><small>ellenőrző felület</small></div>
    <nav class="tabs" id="tabs">
      <button data-tab="nyitott" class="on">Nyitott kérdések</button>
      <button data-tab="javaslatok">Javaslatok</button>
      <button data-tab="szemelyek">Személyek</button>
      <button data-tab="csoportok">Csoportok</button>
      <button data-tab="harm">Keresés besorolás szerint</button>
      <button data-tab="szabalyok">Szabályok</button>
      <button data-tab="kodkonyv">Kódkönyvek</button>
      <button data-tab="seged">Segédadatbázisok</button>
      <button data-tab="naplo">Napló</button>
      <button data-tab="munkatarsak" class="hidden">Munkatársak</button>
    </nav>
    <div class="user"><span id="userinfo"></span><button class="btn" id="pwbtn">Jelszócsere</button><button class="btn" id="logout">Kilépés</button></div>
  </div>
</header>

<section id="login" class="card login hidden">
  <h2>Belépés</h2>
  <p>Az ElitData munkatársai a kapott e-mail-címmel és jelszóval léphetnek be.</p>
  <form id="loginform" class="form">
    <label>E-mail-cím<input type="email" id="email" required autocomplete="email"></label>
    <label>Jelszó<input type="password" id="jelszo" autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Belépés</button>
    <button class="btn" type="button" id="linkbtn">Belépési link kérése e-mailben</button>
  </form>
  <div id="loginmsg"></div>
</section>

<section id="noaccess" class="card login hidden">
  <h2>Nincs hozzáférésed</h2>
  <p>Be vagy jelentkezve (<span id="noaccess-email"></span>), de nem szerepelsz a munkatársak listáján. Kérd meg az adatbázis gazdáját, hogy vegyen fel a munkatársak listájára.</p>
  <button class="btn" id="logout2">Kilépés</button>
</section>

<main class="wrap hidden" id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js?v=2026-10-30j"></script>
</body>
</html>
